<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<title>Out in the DMV · Things worth leaving the house for</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow"><span class="logo">OUT<i>/</i>DMV</span><span class="meta-line" id="metaLine"></span></div>
    <h1>Things worth<br>leaving the house for.</h1>
    <p class="dek">DC, Maryland and Virginia. Every pick we've ever made, upcoming first, nothing deleted.</p>
  </div>
  <section class="weekend wrap" id="weekend"></section>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="days" id="days"></div>
    <div class="ctrl">
      <input id="q" type="search" placeholder="Search events, venues, neighborhoods…" autocomplete="off">
      <div class="seg" id="view"><button data-view="list" class="on">List</button><button data-view="map">Map</button></div>
    </div>
    <div class="chips" id="who"></div>
    <div class="chips" id="cats"></div>
    <div class="chips jump" id="jump" hidden></div>
  </div>
</div>

<main class="wrap">
  <div id="list"></div>
  <div id="map" hidden></div>
  <p id="empty" class="empty" hidden>Nothing matches those filters.</p>
</main>

<section class="wrap archive">
  <details id="archWrap"><summary id="archSum"></summary><div id="arch"></div></details>
</section>

<footer class="wrap">Dates, prices and tickets change. Check the event page before you go. Updated <span id="updated"></span>.</footer>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><article class="sheet-card" id="sheetCard"></article></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js?v=6"></script>
</body>
</html>
